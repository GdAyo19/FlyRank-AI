# Task API stack: FastAPI app + Postgres, started together with one command.
#
#   docker compose up --build
#
# The db service keeps data in a named volume (pgdata), so tasks survive
# container restarts and even `docker compose down`. The app connects using
# credentials from .env and waits for the database to become healthy.

services:
  db:
    image: postgres:16-alpine
    container_name: taskapi-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskapp}
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
    volumes:
      # Named volume = data persists across container lifecycles.
      - pgdata:/var/lib/postgresql/data
      # One-shot schema setup, runs only when the volume is first created.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskapp} -d ${POSTGRES_DB:-tasks}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: taskapi-app
    # Pass our credentials; DATABASE_URL targets the db service by its compose
    # hostname (db), which only resolves inside this network.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskapp}:${POSTGRES_PASSWORD:-taskapp}@db:5432/${POSTGRES_DB:-tasks}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: